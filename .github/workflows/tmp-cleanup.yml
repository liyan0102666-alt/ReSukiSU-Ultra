name: Cleanup sync workflow for redesign

on:
  workflow_dispatch:

permissions: write-all

jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sync workflow and self
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git rm -q --ignore-unmatch .github/workflows/sync-upstream.yml .github/workflows/tmp-cleanup.yml
          git commit -m "chore: remove sync workflow for redesign" || true
          git push origin main
