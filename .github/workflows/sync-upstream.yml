name: Sync upstream (ReSukiSU + KernelSU)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge ReSukiSU/ReSukiSU main
        id: sync_resukisu
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add resukisu https://github.com/ReSukiSU/ReSukiSU.git
          git fetch resukisu main
          git merge --no-commit resukisu/main

      - name: Merge tiann/KernelSU main
        id: sync_kernelsu
        if: steps.sync_resukisu.outcome == 'success'
        continue-on-error: true
        run: |
          git remote add kernelsu https://github.com/tiann/KernelSU.git
          git fetch kernelsu main
          git merge --no-commit kernelsu/main

      - name: Exclude upstream workflow changes
        run: |
          git checkout HEAD -- .github/workflows || true
          git add -A

      - name: Commit merge result
        run: |
          git commit -m "sync: merge ReSukiSU and KernelSU upstream" || git commit --allow-empty -m "sync: no changes"

      - name: Push clean merges to main
        if: steps.sync_resukisu.outcome == 'success' && steps.sync_kernelsu.outcome == 'success'
        run: git push origin main

      - name: Open PR for merge conflicts
        if: steps.sync_resukisu.outcome == 'failure' || steps.sync_kernelsu.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -f origin HEAD:sync-upstream-conflicts || (gh auth setup-git && git push -f origin HEAD:sync-upstream-conflicts)
          gh pr create --base main --head sync-upstream-conflicts \
            --title "Sync upstream: merge conflicts need resolution" \
            --body "上游同步合并产生冲突（ReSukiSU/ReSukiSU 或 tiann/KernelSU），冲突状态已推送到 sync-upstream-conflicts 分支，请手动解决后合并。解决后下次同步会尝试干净合并。" \
            || echo "::warning::PR 未能创建（可能已存在同名 PR）"
