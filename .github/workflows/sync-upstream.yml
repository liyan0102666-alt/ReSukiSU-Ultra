name: Sync upstream (ReSukiSU + KernelSU)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge ReSukiSU/ReSukiSU main
        id: sync_resukisu
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add resukisu https://github.com/ReSukiSU/ReSukiSU.git
          git fetch resukisu main
          git merge --no-edit resukisu/main

      - name: Merge tiann/KernelSU main
        id: sync_kernelsu
        continue-on-error: true
        run: |
          git remote add kernelsu https://github.com/tiann/KernelSU.git
          git fetch kernelsu main
          git merge --no-edit kernelsu/main

      - name: Push clean merges to main
        if: steps.sync_resukisu.outcome == 'success' && steps.sync_kernelsu.outcome == 'success'
        run: git push origin main

      - name: Open PR for merge conflicts
        if: steps.sync_resukisu.outcome == 'failure' || steps.sync_kernelsu.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b sync-upstream-conflicts
          git add -A
          git commit -m "sync: upstream merge needs conflict resolution" || true
          git push origin sync-upstream-conflicts || true
          gh pr create --base main --head sync-upstream-conflicts \
            --title "Sync upstream: merge conflicts need resolution" \
            --body "上游同步合并产生冲突（ReSukiSU/ReSukiSU 或 tiann/KernelSU），请手动解决本 PR 冲突后合并。" || true
